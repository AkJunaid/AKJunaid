name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          # Your GitHub username is used to fetch the contribution graph
          github_user_name: akjunaid
          
          # FORCED BLACK PALETTE with BLACK BACKGROUND
          outputs: |
            dist/github-snake.svg?palette=github-dark&background_color=000000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output # The branch where the image is stored
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
